manifest_version: 2
api_version: 1
name: power-guard
version: 0.4.0
description: "Wait for Hermes sessions, background processes, and subagents to finish; show a cancelable countdown; then request a Windows power action."
author: "Yueyue673"
license: MIT
tags: [automation, power, windows, desktop, safety]
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - post_llm_call
  - on_session_end
  - pre_approval_request
  - post_approval_response
  - pre_gateway_dispatch
  - kanban_task_claimed
  - kanban_task_completed
  - kanban_task_blocked
  - on_kanban_worker_exited
