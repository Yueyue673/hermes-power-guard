<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Power Guard</title>
  <desc id="desc">等工作结束，显示可取消倒计时，再请求睡眠。当前还有一个会话和一个子代理。</desc>
  <rect width="1440" height="560" fill="#f7f5ef"/>
  <g font-family="system-ui, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="96" y="118" fill="#61746a" font-size="15" font-weight="500">Power Guard</text>
    <text x="96" y="178" fill="#243d34" font-size="40" font-weight="500">等工作结束，再请求睡眠。</text>
    <text x="96" y="218" fill="#61746a" font-size="18">Wait for the work. Then request sleep.</text>

    <line x1="180" y1="312" x2="1260" y2="312" stroke="#c9d4c8" stroke-width="1.5"/>
    <g fill="#f7f5ef" stroke="#243d34" stroke-width="1.5">
      <circle cx="180" cy="312" r="7"/>
      <circle cx="900" cy="312" r="7"/>
      <circle cx="1260" cy="312" r="7"/>
    </g>
    <circle cx="540" cy="312" r="7" fill="#315e4b"/>

    <g fill="#243d34" font-size="16" font-weight="500" text-anchor="middle">
      <text x="180" y="360">确认一次</text>
      <text x="540" y="360">等工作</text>
      <text x="900" y="360">倒计时</text>
      <text x="1260" y="360">请求睡眠</text>
    </g>
    <g fill="#61746a" font-size="14" text-anchor="middle">
      <text x="180" y="388">每次单独确认</text>
      <text x="540" y="388">会话 1 · 子代理 1</text>
      <text x="900" y="388">看得见，可以取消</text>
      <text x="1260" y="388">证据齐了才发送</text>
    </g>

    <line x1="96" y1="448" x2="1344" y2="448" stroke="#d5ddd0"/>
    <text x="96" y="488" fill="#61746a" font-size="15">缺证据就保持唤醒。</text>
    <text x="1344" y="488" fill="#61746a" font-size="15" text-anchor="end">Windows · v0.4</text>
  </g>
</svg>
