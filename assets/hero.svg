<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Power Guard</title>
  <desc id="desc">A one-shot automatic sleep controller for Hermes Desktop, shown waiting for two active work items.</desc>
  <rect width="1440" height="640" fill="#0b0d10"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(92 96)" fill="none" stroke="#f2f4f7" stroke-width="4" stroke-linecap="round">
      <path d="M24 8a22 22 0 1 0 16 7"/>
      <path d="M24 0v22"/>
      <circle cx="43" cy="42" r="3" fill="#8ea4ff" stroke="none"/>
    </g>
    <text x="92" y="188" fill="#f2f4f7" font-size="22" font-weight="600" letter-spacing="0.2">HERMES POWER GUARD</text>
    <text x="92" y="278" fill="#f2f4f7" font-size="60" font-weight="600" letter-spacing="-1.8">Wait for the work.</text>
    <text x="92" y="346" fill="#f2f4f7" font-size="60" font-weight="600" letter-spacing="-1.8">Then request sleep.</text>
    <text x="94" y="400" fill="#a4abb5" font-size="19" font-weight="400">One confirmation. A visible countdown. No action when evidence is missing.</text>
    <g transform="translate(94 472)">
      <rect x="0" y="0" width="132" height="34" rx="5" fill="#8ea4ff"/>
      <text x="66" y="22" fill="#0b0d10" font-size="13" font-weight="600" text-anchor="middle">Windows · v0.4</text>
      <text x="154" y="22" fill="#6f7782" font-size="13">Hermes Desktop plugin</text>
    </g>

    <g transform="translate(778 62)">
      <rect width="572" height="516" rx="10" fill="#111419" stroke="#262a31"/>
      <text x="32" y="44" fill="#f2f4f7" font-size="16" font-weight="600">Power Guard</text>
      <text x="540" y="44" fill="#6f7782" font-size="12" text-anchor="end">OVERVIEW</text>
      <line x1="32" y1="68" x2="540" y2="68" stroke="#262a31"/>

      <circle cx="38" cy="108" r="4" fill="#8ea4ff"/>
      <text x="54" y="112" fill="#a4abb5" font-size="12">SLEEP · ACTIVE ONCE</text>
      <text x="32" y="166" fill="#f2f4f7" font-size="30" font-weight="600" letter-spacing="-0.5">Hermes has 2 items left</text>
      <text x="32" y="198" fill="#a4abb5" font-size="14">1 session · 0 background · 1 subagent · 0 other windows</text>
      <text x="32" y="224" fill="#6f7782" font-size="14">No action needed. The 30-second late-work check starts when both finish.</text>

      <rect x="32" y="252" width="190" height="36" rx="5" fill="#20242b"/>
      <text x="127" y="275" fill="#f2f4f7" font-size="13" font-weight="500" text-anchor="middle">Cancel this automatic sleep</text>
      <rect x="232" y="252" width="124" height="36" rx="5" fill="none" stroke="#343943"/>
      <text x="294" y="275" fill="#a4abb5" font-size="13" text-anchor="middle">Delay 15 min</text>

      <line x1="32" y1="320" x2="540" y2="320" stroke="#262a31"/>
      <circle cx="38" cy="348" r="4" fill="#8ea4ff"/>
      <text x="54" y="352" fill="#f2f4f7" font-size="14" font-weight="500">Hermes work is still running</text>
      <text x="540" y="352" fill="#a4abb5" font-size="12" text-anchor="end">2 items remaining</text>
      <text x="32" y="390" fill="#6f7782" font-size="12">VIEW ALL CONDITIONS</text>

      <line x1="32" y1="420" x2="540" y2="420" stroke="#262a31"/>
      <g fill="#6f7782" font-size="11">
        <text x="32" y="452">SESSIONS</text><text x="126" y="452">BACKGROUND</text><text x="238" y="452">SUBAGENTS</text><text x="342" y="452">INPUT IDLE</text><text x="454" y="452">EXPIRES</text>
      </g>
      <g fill="#f2f4f7" font-size="15" font-weight="500">
        <text x="32" y="478">1</text><text x="126" y="478">0</text><text x="238" y="478">1</text><text x="342" y="478">05:42</text><text x="454" y="478">11h 38m</text>
      </g>
    </g>
  </g>
</svg>
