<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Power Guard 概览界面</title>
  <desc id="desc">Power Guard 正在等待一个 Hermes 会话和一个子代理完成。</desc>
  <rect width="1280" height="760" fill="#0b0d10"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="110" y="52" width="1060" height="656" rx="10" fill="#111419" stroke="#262a31"/>
    <text x="150" y="98" fill="#f2f4f7" font-size="18" font-weight="600">Power Guard</text>
    <text x="150" y="122" fill="#6f7782" font-size="12">等待会话、后台进程和子代理结束，再检查键鼠空闲并显示可取消倒计时。</text>

    <g transform="translate(796 78)" font-size="12">
      <rect x="0" y="0" width="260" height="32" rx="5" fill="#1a1e24"/>
      <rect x="2" y="2" width="62" height="28" rx="4" fill="#2b3038"/>
      <text x="33" y="21" fill="#f2f4f7" text-anchor="middle">概览</text>
      <text x="96" y="21" fill="#8a919c" text-anchor="middle">规则</text>
      <text x="160" y="21" fill="#8a919c" text-anchor="middle">节能</text>
      <text x="224" y="21" fill="#8a919c" text-anchor="middle">记录</text>
    </g>

    <line x1="150" y1="154" x2="1130" y2="154" stroke="#262a31"/>
    <circle cx="156" cy="190" r="4" fill="#8ea4ff"/>
    <text x="170" y="194" fill="#a4abb5" font-size="12">睡眠</text>
    <text x="150" y="248" fill="#f2f4f7" font-size="34" font-weight="600" letter-spacing="-0.6">Hermes 还有 2 项工作</text>
    <text x="150" y="282" fill="#a4abb5" font-size="14">会话 1 · 后台 0 · 子代理 1 · 其他窗口 0</text>
    <text x="150" y="310" fill="#6f7782" font-size="14">无需操作；所有工作结束后自动继续。</text>

    <rect x="150" y="340" width="186" height="38" rx="5" fill="#20242b"/>
    <text x="243" y="364" fill="#f2f4f7" font-size="13" font-weight="500" text-anchor="middle">取消本次自动睡眠</text>
    <rect x="348" y="340" width="126" height="38" rx="5" fill="none" stroke="#343943"/>
    <text x="411" y="364" fill="#a4abb5" font-size="13" text-anchor="middle">延后 15 分钟</text>

    <line x1="150" y1="420" x2="1130" y2="420" stroke="#262a31"/>
    <circle cx="156" cy="452" r="4" fill="#8ea4ff"/>
    <text x="172" y="456" fill="#f2f4f7" font-size="14" font-weight="500">等待 Hermes 工作结束</text>
    <text x="336" y="456" fill="#8a919c" font-size="13">· 剩余 2 项</text>
    <text x="1054" y="456" fill="#8a919c" font-size="12" text-anchor="end">查看全部条件</text>
    <path d="M1072 449l5 5 5-5" fill="none" stroke="#8a919c" stroke-width="1.5"/>

    <line x1="150" y1="492" x2="1130" y2="492" stroke="#262a31"/>
    <g fill="#6f7782" font-size="11">
      <text x="150" y="530">会话</text><text x="294" y="530">后台</text><text x="438" y="530">子代理</text><text x="582" y="530">其他窗口</text><text x="746" y="530">键鼠空闲</text><text x="914" y="530">本次剩余</text>
    </g>
    <g fill="#f2f4f7" font-size="17" font-weight="500">
      <text x="150" y="560">1</text><text x="294" y="560">0</text><text x="438" y="560">1</text><text x="582" y="560">0</text><text x="746" y="560">5 分 42 秒</text><text x="914" y="560">11 小时 38 分</text>
    </g>

    <line x1="150" y1="604" x2="1130" y2="604" stroke="#262a31"/>
    <text x="150" y="638" fill="#6f7782" font-size="11">最近操作</text>
    <text x="150" y="666" fill="#a4abb5" font-size="13">规则已保存 · 17:42</text>
  </g>
</svg>
