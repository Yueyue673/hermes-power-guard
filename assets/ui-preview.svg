<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Power Guard 概览界面</title>
  <desc id="desc">Power Guard 正在等待一个 Hermes 会话和一个子代理完成。</desc>
  <rect width="1280" height="720" fill="#f7f5ef"/>
  <g font-family="system-ui, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="80" y="76" fill="#243d34" font-size="18" font-weight="500">Power Guard</text>
    <text x="80" y="104" fill="#61746a" font-size="13">等待会话、后台进程和子代理结束，再检查键鼠空闲并显示可取消倒计时。</text>

    <g font-size="13">
      <text x="848" y="76" fill="#243d34" font-weight="500">概览</text>
      <line x1="848" y1="86" x2="876" y2="86" stroke="#315e4b" stroke-width="1.5"/>
      <text x="916" y="76" fill="#61746a">规则</text>
      <text x="972" y="76" fill="#61746a">节能</text>
      <text x="1028" y="76" fill="#61746a">记录</text>
    </g>

    <line x1="80" y1="132" x2="1200" y2="132" stroke="#d5ddd0"/>

    <circle cx="86" cy="172" r="3.5" fill="#315e4b"/>
    <text x="100" y="176" fill="#61746a" font-size="13">睡眠</text>
    <text x="80" y="228" fill="#243d34" font-size="28" font-weight="500">Hermes 还有 2 项工作</text>
    <text x="80" y="262" fill="#3e564b" font-size="15">会话 1 · 后台 0 · 子代理 1 · 其他窗口 0</text>
    <text x="80" y="290" fill="#61746a" font-size="14">无需操作；所有工作结束后自动继续。</text>

    <rect x="80" y="320" width="168" height="36" rx="4" fill="#315e4b"/>
    <text x="164" y="343" fill="#f7f5ef" font-size="13" font-weight="500" text-anchor="middle">取消本次自动睡眠</text>
    <rect x="260" y="320" width="124" height="36" rx="4" fill="#fffef9" stroke="#c9d4c8"/>
    <text x="322" y="343" fill="#3e564b" font-size="13" text-anchor="middle">延后 15 分钟</text>

    <line x1="80" y1="388" x2="1200" y2="388" stroke="#d5ddd0"/>
    <circle cx="86" cy="424" r="3.5" fill="#315e4b"/>
    <text x="100" y="428" fill="#243d34" font-size="14" font-weight="500">等待 Hermes 工作结束</text>
    <text x="318" y="428" fill="#61746a" font-size="13">· 剩余 2 项</text>
    <text x="1124" y="428" fill="#61746a" font-size="13" text-anchor="end">查看全部条件</text>
    <path d="M1140 422 l4 4 4 -4" fill="none" stroke="#61746a" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>

    <line x1="80" y1="464" x2="1200" y2="464" stroke="#d5ddd0"/>
    <g fill="#61746a" font-size="12">
      <text x="80" y="500">会话</text>
      <text x="248" y="500">后台</text>
      <text x="416" y="500">子代理</text>
      <text x="584" y="500">其他窗口</text>
      <text x="784" y="500">键鼠空闲</text>
      <text x="984" y="500">本次剩余</text>
    </g>
    <g fill="#243d34" font-size="16" font-weight="500">
      <text x="80" y="530">1</text>
      <text x="248" y="530">0</text>
      <text x="416" y="530">1</text>
      <text x="584" y="530">0</text>
      <text x="784" y="530">5 分 42 秒</text>
      <text x="984" y="530">11 小时 38 分</text>
    </g>

    <line x1="80" y1="576" x2="1200" y2="576" stroke="#d5ddd0"/>
    <text x="80" y="612" fill="#61746a" font-size="12">最近操作</text>
    <text x="80" y="640" fill="#3e564b" font-size="14">规则已保存 · 17:42</text>
  </g>
</svg>
